<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betrug.</title>
    <link rel="icon" type="image/png" href="logo.png">
</head>
<style>
    body {
        background-color: rgb(0, 0, 0);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
    }

    .ss {
        animation: fly 1.2s ease-in-out infinite alternate;
    }

    .arrow {
        animation: arrows 1.2s ease-in-out infinite alternate;
        position: fixed;
        top: 20%;
        scale: 0.1;
        transform: translateX(-320%);
        top: 0%;
        rotate: 10deg;
    }

    @keyframes fly {

        0%  {
            rotate: 2deg;
            scale: 1;
        }

        100% {
        rotate: -2deg;
        scale: 1.2;
        }
        
        
        
    }


    
    @keyframes arrows {

        0%  {
            scale: 0.12;
        }

        100% {
        scale: 0.1;
        }
        
        
        
    }
</style>
<body>
    <img class="arrow" src="Arrow.png" alt="arrow">
    <img class="ss" src="ss.png" alt="loh">
</body>
</html>
