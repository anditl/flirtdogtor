<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flirtdogtor</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        body {
            background-color: rgb(10, 10, 10);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        p {
            position: fixed;
            top: 90%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 15px;
            color: aliceblue;
            opacity: 20%;
        }


        .ownership {
            user-select: none;
            top: 94%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-family: sans-serif;
            color: aliceblue;
            opacity: 20%;
        }

        @keyframes fadeInUp {
            from {
                filter: blur(2px);
                opacity: 0;
                transform: translateY(35px) rotate(-10deg);
            }
            to {
                opacity: 1;
                transform: rotate(0);
                filter: blur(0px);
                transform: translateY(0) rotate(0deg);
            }
        }

    .logo {
    opacity: 0;
    animation: fadeInUp 1s ease-out 0.5s both;
}


    .unselectable {
        user-select: none;          /* Standard syntax */
        -webkit-user-select: none;  /* Safari & Chrome */
        -moz-user-select: none;     /* Firefox */
        -ms-user-select: none;      /* Edge/IE */
        -webkit-user-drag: none;    /* Prevents image ghost-dragging in WebKit */
        -webkit-touch-callout: none;/* Disables long-press menu on iOS */
}

    .logo img {
        user-select: none;
    width: 80px;
    height: auto;
    display: block;
    transition: transform 0.3s ease, filter 0.3s ease;
}

    .logo:hover img {
    transform: scale(1.1) rotate(2deg);
    filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.356))
}
    </style>
</head>
<body>
    <p>mail@flirtdogtor.com</p>
    <p class="ownership">Made with ❤ · © <span id="year">2026</span> CV</p>
    <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
    <div class="logo">
        <img src="logo.png" alt="logo" class="unselectable">
    </div>
</body>
</html>
